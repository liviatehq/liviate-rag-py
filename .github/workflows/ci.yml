name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # python-magic (used for file-type sniffing in ingest()) needs libmagic.
      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install package (dev extras)
        run: python -m pip install -e ".[dev]"

      - name: Run unit + integration tests
        run: python -m pytest tests/unit tests/integration -v

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Verify wheel installs and imports cleanly
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/python -c "from liviate_rag import RAGClient, AsyncRAGClient"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
