[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liviate-rag"
version = "0.1.1"
description = "Client SDK for Liviate's RAG stack: ingest, embed, retrieve, rerank, and (optionally) generate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "openai>=1.30",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/liviate_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
